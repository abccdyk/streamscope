name: StreamScope CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    # These are disposable CI-only credentials, not local or production secrets.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_root_password
          MYSQL_DATABASE: streamscope_ci
          MYSQL_USER: streamscope_ci
          MYSQL_PASSWORD: ci_only_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_only_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/streamscope_ci
      DB_USERNAME: streamscope_ci
      DB_PASSWORD: ci_only_app_password
      TWITCH_CLIENT_ID: ci-placeholder
      TWITCH_CLIENT_SECRET: ci-placeholder

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        run: ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --tag streamscope-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag streamscope-frontend:ci ./frontend