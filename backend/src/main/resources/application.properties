spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/streamscope}
spring.datasource.username=${DB_USERNAME:streamscope}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
twitch.client-id=${TWITCH_CLIENT_ID}
twitch.client-secret=${TWITCH_CLIENT_SECRET}

spring.cloud.openfeign.client.config.twitchAuth.connectTimeout=2000
spring.cloud.openfeign.client.config.twitchAuth.readTimeout=5000
spring.cloud.openfeign.client.config.twitchApi.connectTimeout=2000
spring.cloud.openfeign.client.config.twitchApi.readTimeout=5000

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax